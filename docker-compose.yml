services:
  postgres:
    image: postgres:17
    container_name: helpcenter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpcenter
      POSTGRES_PASSWORD: helpcenter
      POSTGRES_DB: helpcenter
    ports:
      - "5433:5432"
    volumes:
      - helpcenter_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpcenter -d helpcenter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  helpcenter_pg_data:
